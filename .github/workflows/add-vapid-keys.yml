# ONE-OFF. Adds the Web Push (VAPID) keys to the production .env, then restarts the app.
# Started by hand (Actions -> "Add VAPID keys" -> Run workflow). Delete this file afterwards.
#
# Safe to run twice: it changes nothing if VAPID_PRIVATE_KEY is already in .env, backs up .env
# first, and never prints a key. The key pair is generated ON the server, so it never exists in
# GitHub or in a log.
name: Add VAPID keys

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Contact address shown to push services, e.g. noreply@example.com"
        required: true

env:
  VPS_HOST: vps-9d96501a.vps.ovh.ca
  VPS_USER: ubuntu
  APP_DIR: /home/ubuntu/ostastay

jobs:
  add-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Add keys and restart
        env:
          SUBJECT: ${{ inputs.subject }}
        run: |
          if ! printf '%s' "$SUBJECT" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then
            echo "subject must be a plain email address"; exit 1
          fi
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "SUBJECT='$SUBJECT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/ostastay
          if grep -q '^VAPID_PRIVATE_KEY=' .env; then
            echo "VAPID keys already in .env - nothing changed"
            exit 0
          fi
          cp .env ".env.bak-$(date +%Y%m%d%H%M%S)"
          KEYS=$(docker compose run --rm --no-deps -T --entrypoint node app -e "
            const c=require('crypto');
            const k=c.generateKeyPairSync('ec',{namedCurve:'prime256v1'});
            const p=k.publicKey.export({format:'jwk'}), v=k.privateKey.export({format:'jwk'});
            const pub=Buffer.concat([Buffer.from([4]),Buffer.from(p.x,'base64url'),Buffer.from(p.y,'base64url')]).toString('base64url');
            console.log('VAPID_PUBLIC_KEY='+pub);
            console.log('VAPID_PRIVATE_KEY='+v.d);
          " </dev/null | grep "^VAPID_")
          case "$KEYS" in VAPID_PUBLIC_KEY=*) ;; *) echo "key generation failed"; exit 1;; esac
          printf '\n%s\nVAPID_SUBJECT=mailto:%s\n' "$KEYS" "$SUBJECT" >> .env
          docker compose up -d app
          echo "Keys added and app restarted"
          REMOTE
