# OstaStay — production stack: app + PostgreSQL.
#
# Publishes NO host ports. The shared edge proxy (deploy/proxy/) owns 80/443 and reaches
# the app by service name over the `edge` network, which is what lets several projects
# share this host without fighting over port 3000. Start the proxy first — see DEPLOY.md.
#
# The app service is scale-ready: `docker compose up -d --scale app=3` works because it
# has neither a fixed container_name nor a host port binding, and Caddy load-balances
# across every replica via Docker's DNS. Sessions are stateless JWTs, so no sticky
# sessions are required. Read the scaling notes in DEPLOY.md before going past one
# replica — guest ID photos live on a shared volume, which is fine on ONE host and needs
# object storage across several.

services:
  db:
    image: postgres:17-alpine
    container_name: ostastay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: osta
      POSTGRES_DB: ostastay
      # No default on purpose: compose refuses to start rather than silently bring up a
      # database with a blank or guessable password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set — copy .env.production.example to .env and fill it in}
    volumes:
      # THE most important thing on this host. Every reservation, folio, payment, and
      # guest profile lives here. See the backup section of DEPLOY.md.
      - osta-db:/var/lib/postgresql/data
    # Deliberately NO `ports:` — the database is reachable only from the app container
    # over the internal Docker network, never from the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osta -d ostastay"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # This host is shared with other projects. Without a ceiling, a heavy query or a
    # runaway build can consume all 4 CPUs and starve everyone else. Postgres is also
    # given a matching shared_buffers below its memory cap.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ostastay:latest
    # No container_name: it must stay unset for `--scale app=N` to be possible, since
    # Docker cannot give N containers the same name.
    restart: unless-stopped

    depends_on:
      db:
        # Waits for pg_isready, not merely for the container to exist — the entrypoint
        # runs migrations immediately and would fail against a half-started database.
        condition: service_healthy

    # Secrets and settings come from .env at runtime — never from the image.
    # Copy .env.production.example to .env and fill it in before the first start.
    env_file:
      - .env

    environment:
      # Composed here rather than in .env so the credentials can never drift out of sync
      # with the db service above. "db" is the service name, resolved by Docker's
      # internal DNS; 5432 is container-internal and not published to the host.
      # connection_limit is pinned rather than left to Prisma's default of
      # (cpu_count * 2 + 1), which would be ~9 per replica: three replicas would open 27
      # connections against Postgres's 100 without anyone choosing that number. At 5 per
      # replica the arithmetic stays obvious as replicas are added.
      DATABASE_URL: "postgresql://osta:${POSTGRES_PASSWORD}@db:5432/ostastay?schema=public&connection_limit=5"

    # No `ports:` — deliberately. The app is reached only through the edge proxy, so
    # nothing can bypass the TLS, security headers, or rate limits by hitting :3000
    # directly, and the port is free for other projects on this host. Publishing a host
    # port would also make `--scale app=N` impossible.

    volumes:
      # eRegistration ID photos (passport/ID scans) are written to local disk, not to the
      # database — so they need their own volume and their own backup.
      - osta-uploads:/app/storage

    healthcheck:
      # Node 22 has global fetch, so this needs no extra package in the image. Hits the
      # login page: cheap, unauthenticated, and it exercises the full render path rather
      # than just proving the port is open.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Per-replica ceiling on a host shared with other projects. With `--scale app=3`
    # this becomes 3 x these numbers, so check `docker stats` and the table in
    # deploy/proxy/sites.d/README.md before scaling up.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

    networks:
      # `default` reaches the database; `edge` is how the proxy reaches this app. The
      # db service is deliberately NOT on `edge`, so nothing outside this stack can
      # reach Postgres even by name.
      - default
      - edge

    logging:
      # Without this, container logs grow without bound and eventually fill the VPS disk.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:
    # Created once with `docker network create edge` and shared with the proxy stack and
    # every other project on this host.
    external: true

volumes:
  osta-db:
  osta-uploads:
