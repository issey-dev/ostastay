openapi: 3.1.0
info:
  title: Uppsolut Stay — Booking API
  version: "1.1.0"
  summary: Property information, live availability and prices, and bookings — rooms, excursions and spa — for a property's own brand website.
  description: |
    Key-authenticated API for a property's brand website. Keys are created in the enterprise Hub
    (Booking API → API Keys), grant access to one or more of the enterprise's properties, and are
    enabled for Rooms, Excursions and/or Spa. The full guide is at /docs/api-integration.

    Conventions: dates are `YYYY-MM-DD` calendar days; check-out is exclusive; money is a number
    in the property's currency; every response is `Cache-Control: no-store`; errors carry a
    stable `code`.
servers:
  - url: https://{host}/api/website/v1
    variables:
      host:
        default: stay.uppsolut.com
        description: The Uppsolut Stay host for the enterprise.

security:
  - bearerKey: []
  - headerKey: []

tags:
  - name: Properties
    description: The property page, and which modules this key can book there.
  - name: Availability
    description: Rooms — live availability and nightly prices.
  - name: Bookings
    description: Rooms — quotes, bookings and booking lookup.
  - name: Excursions
    description: Excursion catalogue, departures, quotes, holds and bookings. Needs the EXCURSIONS scope.
  - name: Spa
    description: Spa treatments, free times, quotes, holds and bookings. Needs the SPA scope.
  - name: Activity bookings
    description: Look up and cancel excursion and spa bookings by reference and email.

paths:
  /properties:
    get:
      tags: [Properties]
      summary: List the properties this key may act on
      operationId: listProperties
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [properties]
                properties:
                  properties:
                    type: array
                    items: { $ref: "#/components/schemas/PropertySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /properties/{propertyId}:
    parameters:
      - $ref: "#/components/parameters/propertyId"
    get:
      tags: [Properties]
      summary: Property details for a property page
      operationId: getProperty
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [property]
                properties:
                  property: { $ref: "#/components/schemas/Property" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  /properties/{propertyId}/availability:
    parameters:
      - $ref: "#/components/parameters/propertyId"
    get:
      tags: [Availability]
      summary: Per-night availability and calendar prices
      operationId: getAvailability
      description: |
        For every sellable room type and every night in `[from, to)`: rooms available (real
        inventory, never below 0), whether a stop-sale closes the night, and the room rate on the
        rate plan configured in the Hub. At most 62 nights per call. Nightly `price` is the room
        rate only — use the quote endpoint for the amount a guest pays.
      parameters:
        - name: from
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Day" }
          description: First night (check-in).
        - name: to
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Day" }
          description: Exclusive end (check-out).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  /properties/{propertyId}/quote:
    parameters:
      - $ref: "#/components/parameters/propertyId"
    post:
      tags: [Bookings]
      summary: Price a stay (authoritative, includes taxes)
      operationId: quoteStay
      description: |
        The amount a guest would pay for the stay, computed by the same code the PMS posts charges
        with — room rate, extra-occupancy surcharges, package components, taxes, service charge and
        Green Tax. Never writes anything. Also reports whether the stay is bookable right now.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StayRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [quote]
                properties:
                  quote: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /properties/{propertyId}/bookings:
    parameters:
      - $ref: "#/components/parameters/propertyId"
    post:
      tags: [Bookings]
      summary: Create a booking
      operationId: createBooking
      description: |
        Creates a real reservation (status RESERVED) in the property's PMS through the same
        service the front desk uses — confirmation number from the property's sequence, master
        folio opened, guest profile matched by email or created. The website can never overbook:
        a stay that no longer fits is refused with SOLD_OUT.

        Send a fresh UUID as `Idempotency-Key` per attempt and reuse it on retry: the same key
        returns the same booking (`replayed: true`, HTTP 200) instead of a second reservation.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 8, maxLength: 128 }
          description: Unique per booking attempt; reuse on retry. May also be sent as `idempotencyKey` in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingRequest" }
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking: { $ref: "#/components/schemas/Booking" }
        "200":
          description: Replay of an earlier booking with the same Idempotency-Key
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /bookings/{confirmationNo}:
    get:
      tags: [Bookings]
      summary: Look up a booking by confirmation number and email
      operationId: getBooking
      description: Only bookings made through this key are visible, and the email must match the one used to book.
      parameters:
        - name: confirmationNo
          in: path
          required: true
          schema: { type: string }
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  /properties/{propertyId}/excursions:
    parameters:
      - $ref: "#/components/parameters/propertyId"
    get:
      tags: [Excursions]
      summary: Excursions sold online, with today's prices and the online booking rules
      operationId: listExcursions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExcursionCatalogue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /properties/{propertyId}/excursions/departures:
    parameters:
      - $ref: "#/components/parameters/propertyId"
    get:
      tags: [Excursions]
      summary: Scheduled departures with live seats left (at most 62 days per call)
      operationId: listDepartures
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: "#/components/schemas/Day" } }
        - { name: to, in: query, required: true, schema: { $ref: "#/components/schemas/Day" } }
        - { name: excursionId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepartureList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /properties/{propertyId}/excursions/quote:
    parameters:
      - $ref: "#/components/parameters/propertyId"
    post:
      tags: [Excursions]
      summary: The authoritative price for a party on a departure. Writes nothing.
      operationId: quoteExcursion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExcursionPartyRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  quote: { $ref: "#/components/schemas/ExcursionQuote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /properties/{propertyId}/excursions/holds:
    parameters:
      - $ref: "#/components/parameters/propertyId"
    post:
      tags: [Excursions]
      summary: Keep seats while your site takes payment (server-only keys)
      operationId: holdExcursion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExcursionPartyRequest" }
      responses:
        "201":
          description: Held
          content:
            application/json:
              schema:
                type: object
                properties:
                  hold: { $ref: "#/components/schemas/ExcursionHold" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /properties/{propertyId}/excursions/bookings:
    parameters:
      - $ref: "#/components/parameters/propertyId"
      - $ref: "#/components/parameters/idempotencyKey"
    post:
      tags: [Excursions]
      summary: Book an excursion — instant, from a hold or directly (server-only keys)
      operationId: bookExcursion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExcursionBookingRequest" }
      responses:
        "201":
          description: Booked
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: "#/components/schemas/ActivityBooking" }
        "200":
          description: Replay of an earlier request with the same Idempotency-Key
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: "#/components/schemas/ActivityBooking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /properties/{propertyId}/spa/treatments:
    parameters:
      - $ref: "#/components/parameters/propertyId"
    get:
      tags: [Spa]
      summary: Treatments sold online, by category, with today's prices and the online booking rules
      operationId: listTreatments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaCatalogue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /properties/{propertyId}/spa/availability:
    parameters:
      - $ref: "#/components/parameters/propertyId"
    get:
      tags: [Spa]
      summary: Free start times on a date, or which days in a range (at most 31) have any
      operationId: spaAvailability
      parameters:
        - { name: treatmentId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: false, schema: { $ref: "#/components/schemas/Day" }, description: One day's start times. }
        - { name: from, in: query, required: false, schema: { $ref: "#/components/schemas/Day" }, description: With `to` instead of `date` — free days. }
        - { name: to, in: query, required: false, schema: { $ref: "#/components/schemas/Day" } }
        - { name: partySize, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: gender, in: query, required: false, schema: { type: string, enum: [MALE, FEMALE] }, description: "Therapist gender, where the property offers it." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaAvailability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /properties/{propertyId}/spa/quote:
    parameters:
      - $ref: "#/components/parameters/propertyId"
    post:
      tags: [Spa]
      summary: The authoritative price for a treatment on a date. Writes nothing.
      operationId: quoteSpa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [treatmentId, date]
              properties:
                treatmentId: { type: string }
                date: { $ref: "#/components/schemas/Day" }
                partySize: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  quote: { $ref: "#/components/schemas/SpaQuote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /properties/{propertyId}/spa/holds:
    parameters:
      - $ref: "#/components/parameters/propertyId"
    post:
      tags: [Spa]
      summary: Keep a therapist per guest and a room while your site takes payment (server-only keys)
      operationId: holdSpa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpaSlotRequest" }
      responses:
        "201":
          description: Held
          content:
            application/json:
              schema:
                type: object
                properties:
                  hold: { $ref: "#/components/schemas/SpaHold" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /properties/{propertyId}/spa/bookings:
    parameters:
      - $ref: "#/components/parameters/propertyId"
      - $ref: "#/components/parameters/idempotencyKey"
    post:
      tags: [Spa]
      summary: Book a treatment — instant, from a hold or directly (server-only keys)
      operationId: bookSpa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpaBookingRequest" }
      responses:
        "201":
          description: Booked
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: "#/components/schemas/ActivityBooking" }
        "200":
          description: Replay of an earlier request with the same Idempotency-Key
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: "#/components/schemas/ActivityBooking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /activity-bookings/{reference}:
    parameters:
      - { name: reference, in: path, required: true, schema: { type: string, example: EXC-7K3QX9MD } }
    get:
      tags: [Activity bookings]
      summary: Look up an excursion or spa booking made with this key
      operationId: getActivityBooking
      parameters:
        - { name: email, in: query, required: true, schema: { type: string, format: email } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: "#/components/schemas/ActivityBooking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /activity-bookings/{reference}/cancel:
    parameters:
      - { name: reference, in: path, required: true, schema: { type: string } }
    post:
      tags: [Activity bookings]
      summary: Guest self-cancel, until the free-cancellation deadline (server-only keys)
      operationId: cancelActivityBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: "#/components/schemas/ActivityBooking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer wsk_…` (preferred)."
    headerKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Alternative to the bearer header.

  parameters:
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
      description: A fresh value (e.g. a UUID) per booking attempt. Retry with the same value and you get the same booking back.
    propertyId:
      name: propertyId
      in: path
      required: true
      schema: { type: string }
      description: Property id from `GET /properties`. A property not covered by the key answers 404.

  responses:
    BadRequest:
      description: Validation or date-window error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            validation:
              value: { error: "Invalid request.", code: "VALIDATION", details: { "guest.email": "A valid email is required" } }
            past:
              value: { error: "Arrival cannot be before 2026-03-04.", code: "ARRIVAL_IN_PAST" }
    Unauthorized:
      description: Missing, unknown, revoked or expired key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Invalid or inactive API key.", code: "INVALID_API_KEY" }
    Forbidden:
      description: The key is valid but not enabled for this module (Rooms, Excursions or Spa).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "This API key is not enabled for Rooms. Ask the property to add it to the key in the Hub.", code: "SCOPE_NOT_GRANTED" }
    TooManyRequests:
      description: >-
        Rate limit reached for this key (120 GET and 20 POST requests per minute), or too
        many failed authentications from this address. Wait `Retry-After` seconds.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the window resets. }
        RateLimit-Limit: { schema: { type: integer } }
        RateLimit-Remaining: { schema: { type: integer } }
        RateLimit-Reset: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Too many requests. Slow down and retry after the time in Retry-After.", code: "RATE_LIMITED" }
    NotFound:
      description: Unknown, or not covered by this key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Property not found.", code: "PROPERTY_NOT_FOUND" }
    Conflict:
      description: The stay cannot be sold online right now
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            soldOut:
              value: { error: "No rooms of this type are available for the selected dates.", code: "SOLD_OUT" }
            stopSale:
              value: { error: "The property is not accepting bookings for one or more of the selected dates.", code: "STOP_SALE" }
            noRate:
              value: { error: "One or more nights have no rate configured. Please contact the property.", code: "NO_RATE" }
            disabled:
              value: { error: "Online booking is not available for this property.", code: "BOOKING_DISABLED" }

  schemas:
    Day:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      example: "2026-03-10"

    ModuleStatus:
      type: object
      required: [enabled, code, reason]
      properties:
        enabled: { type: boolean }
        code:
          type: [string, "null"]
          enum: [SCOPE_NOT_GRANTED, ADDON_NOT_ENABLED, NOT_SOLD_ONLINE, NO_OUTLET, NOTHING_PUBLISHED, BOOKING_DISABLED, null]
        reason: { type: [string, "null"], description: Human-readable; do not show raw to guests. }

    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: Human-readable message. }
        code:
          type: string
          description: Stable machine-readable code.
          enum:
            - MISSING_API_KEY
            - INVALID_API_KEY
            - UNAUTHORIZED
            - VALIDATION
            - INVALID_DATES
            - ARRIVAL_IN_PAST
            - TOO_FAR_AHEAD
            - MIN_STAY
            - STAY_TOO_LONG
            - INVALID_OCCUPANCY
            - PROPERTY_NOT_FOUND
            - ROOM_TYPE_NOT_FOUND
            - BOOKING_NOT_FOUND
            - BOOKING_DISABLED
            - NO_RATE
            - STOP_SALE
            - SOLD_OUT
            - MEAL_PLAN_NOT_OFFERED
            - MEAL_PLAN_NOT_FOUND
            - ADD_ONS_NOT_OFFERED
            - ADD_ON_NOT_FOUND
            - BOOKING_REJECTED
            - IDEMPOTENCY_CONFLICT
            - RATE_LIMITED
            - SCOPE_NOT_GRANTED
            - MODULE_NOT_ENABLED
            - SERVER_KEY_REQUIRED
            - IDEMPOTENCY_KEY_REQUIRED
            - INVALID_PARTY
            - PARTY_TOO_LARGE
            - DEPARTURE_NOT_FOUND
            - TREATMENT_NOT_FOUND
            - DEPARTURE_CLOSED
            - SLOT_UNAVAILABLE
            - BOOKING_CUTOFF
            - HOLD_NOT_FOUND
            - HOLD_EXPIRED
            - HOLD_USED
            - TOO_MANY_HOLDS
            - PRICE_CHANGED
            - PAYMENT_NOT_CONFIGURED
            - ALREADY_CANCELLED
            - CANCEL_CUTOFF_PASSED
            - INTERNAL_ERROR
        details:
          type: object
          additionalProperties: { type: string }
          description: Field path → message, on VALIDATION.

    Ref:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }

    PropertySummary:
      type: object
      required: [id, code, name, currency, timeZone, bookingEnabled]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        headline: { type: [string, "null"] }
        currency: { type: string, example: USD }
        timeZone: { type: string, example: Indian/Maldives }
        starRating: { type: [integer, "null"] }
        imageUrl: { type: [string, "null"], description: First photo. }
        bookingEnabled: { type: boolean }

    RoomTypeFeature:
      type: object
      required: [category, code, label]
      properties:
        category: { type: string, enum: [BED_TYPE, ROOM_VIEW, ROOM_AMENITY] }
        code: { type: string }
        label: { type: string, description: Display label from the enterprise's own list. }

    RoomType:
      type: object
      required: [id, code, name, baseOccupancy, maxOccupancy, totalRooms, features]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        baseOccupancy: { type: integer, description: Adults included before an extra-adult surcharge. }
        maxOccupancy: { type: integer, description: Adults + children allowed. }
        totalRooms: { type: integer, description: "Physical sellable rooms — informational, not availability." }
        features:
          type: array
          items: { $ref: "#/components/schemas/RoomTypeFeature" }

    MealPlanOption:
      type: object
      required: [code, name, isDefault]
      properties:
        code: { type: string, example: BB }
        name: { type: string, example: Bed & Breakfast }
        isDefault: { type: boolean, description: The plan used when the guest expresses no preference. }

    AddOn:
      type: object
      required: [id, code, name, type, postingRhythm]
      description: >-
        A paid extra the guest can tick. Carries NO price: what one costs depends on the
        party, the length of stay and its posting rhythm, so send the id to the quote and
        display the line it returns.
      properties:
        id: { type: string }
        code: { type: string, example: TRF-SB }
        name: { type: string, example: Speedboat Transfer }
        type: { type: string, enum: [FNB, TRANSFER, SPA, EXCURSION, OTHER] }
        postingRhythm: { type: string, enum: [EVERY_NIGHT, ARRIVAL_NIGHT, DEPARTURE_NIGHT] }

    BookingConfig:
      type: object
      required:
        [enabled, reason, ratePlan, mealPlanCode, mealPlanSelectable, mealPlanAffectsPrice,
         mealPlans, addOns, minNights, maxNightsAhead]
      properties:
        enabled: { type: boolean }
        reason: { type: [string, "null"], description: Why `enabled` is false. }
        ratePlan:
          oneOf:
            - $ref: "#/components/schemas/Ref"
            - type: "null"
        mealPlanCode: { type: string, example: BB, description: The plan a booking uses unless the guest picks another. }
        mealPlanSelectable: { type: boolean, description: Whether the guest may choose at all. }
        mealPlanAffectsPrice:
          type: boolean
          description: >-
            Whether choosing a different meal plan changes the price. False when the rate
            plan carries the price and the meal plan is only a label — say so honestly
            rather than implying a cost that is not there.
        mealPlans:
          type: array
          items: { $ref: "#/components/schemas/MealPlanOption" }
          description: Empty unless mealPlanSelectable is true.
        addOns:
          type: array
          items: { $ref: "#/components/schemas/AddOn" }
          description: >
            The extras this property has published to the booking APIs. Empty unless the
            property sells extras online, and never the whole catalogue: each extra is
            published individually in the Hub and may be withdrawn, so read this list
            rather than storing ids.
        minNights: { type: integer }
        maxNightsAhead: { type: integer }

    Property:
      type: object
      required:
        [id, code, name, legalName, imageUrls, checkInTime, checkOutTime, currency, timeZone,
         pricesIncludeTaxes, businessDate, facilities, roomTypes, booking, contact]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        legalName: { type: string }
        headline: { type: [string, "null"] }
        description: { type: [string, "null"] }
        imageUrls: { type: array, items: { type: string, format: uri } }
        logoUrl: { type: [string, "null"] }
        brandColor: { type: [string, "null"], description: Hex colour. }
        starRating: { type: [integer, "null"] }
        address: { type: [string, "null"] }
        location:
          oneOf:
            - type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number }
                longitude: { type: number }
            - type: "null"
        contact:
          type: object
          properties:
            phone: { type: [string, "null"] }
            email: { type: [string, "null"] }
        checkInTime: { type: string, example: "14:00" }
        checkOutTime: { type: string, example: "11:00" }
        currency: { type: string }
        timeZone: { type: string }
        pricesIncludeTaxes: { type: boolean, description: Whether displayed prices already include taxes. }
        businessDate:
          allOf: [{ $ref: "#/components/schemas/Day" }]
          description: The property's operational "today" — the earliest accepted check-in.
        policies: { type: [string, "null"], description: Free text set in the Hub; not enforced by the system. }
        facilities:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              description: { type: [string, "null"] }
        roomTypes:
          type: array
          items: { $ref: "#/components/schemas/RoomType" }
        booking: { $ref: "#/components/schemas/BookingConfig" }
        modules:
          type: object
          description: >-
            Which modules THIS key can book at this property right now. Render a section only
            when its `enabled` is true; re-read rather than hard-code.
          required: [rooms, excursions, spa]
          properties:
            rooms: { $ref: "#/components/schemas/ModuleStatus" }
            excursions: { $ref: "#/components/schemas/ModuleStatus" }
            spa: { $ref: "#/components/schemas/ModuleStatus" }

    Night:
      type: object
      required: [date, available, closed, price, extraAdultPrice, extraChildPrice]
      properties:
        date: { $ref: "#/components/schemas/Day" }
        available: { type: integer, minimum: 0, description: Rooms sellable this night. 0 when closed. }
        closed: { type: boolean, description: A stop-sale applies — not bookable regardless of `available`. }
        price: { type: [number, "null"], description: Room rate for the night on the configured plan; null when unpriced. }
        extraAdultPrice: { type: [number, "null"] }
        extraChildPrice: { type: [number, "null"] }

    RoomTypeAvailability:
      type: object
      required: [id, code, name, baseOccupancy, maxOccupancy, nights, minAvailable, bookable, roomRateTotal]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        baseOccupancy: { type: integer }
        maxOccupancy: { type: integer }
        nights:
          type: array
          items: { $ref: "#/components/schemas/Night" }
        minAvailable: { type: integer, description: Lowest `available` across the window. }
        bookable: { type: boolean, description: "Every night open, in stock and priced, and booking enabled." }
        roomRateTotal: { type: [number, "null"], description: Sum of nightly room rates when every night is priced. Room rate only. }

    Availability:
      type: object
      required: [propertyId, from, to, nights, currency, pricesIncludeTaxes, ratePlan, bookingEnabled, roomTypes]
      properties:
        propertyId: { type: string }
        from: { $ref: "#/components/schemas/Day" }
        to: { $ref: "#/components/schemas/Day" }
        nights: { type: integer }
        currency: { type: string }
        pricesIncludeTaxes: { type: boolean }
        ratePlan:
          oneOf:
            - $ref: "#/components/schemas/Ref"
            - type: "null"
        bookingEnabled: { type: boolean }
        roomTypes:
          type: array
          items: { $ref: "#/components/schemas/RoomTypeAvailability" }

    StayRequest:
      type: object
      required: [checkIn, checkOut, roomTypeId, adults]
      properties:
        checkIn: { $ref: "#/components/schemas/Day" }
        checkOut: { $ref: "#/components/schemas/Day" }
        roomTypeId: { type: string }
        adults: { type: integer, minimum: 1, maximum: 20 }
        children: { type: integer, minimum: 0, maximum: 20, default: 0 }
        mealPlanCode:
          type: [string, "null"]
          maxLength: 40
          description: >-
            Omit for the property's default. Refused with MEAL_PLAN_NOT_OFFERED if the
            property does not let guests choose, rather than silently ignored — a quote
            must never disagree with the booking that follows it.
        addOnIds:
          type: array
          maxItems: 20
          items: { type: string }
          description: >-
            Ids from the property's `booking.addOns`. Refused with ADD_ONS_NOT_OFFERED or
            ADD_ON_NOT_FOUND rather than silently dropped.

    Guest:
      type: object
      required: [firstName, email]
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: [string, "null"], maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: [string, "null"], maxLength: 40 }

    BookingRequest:
      allOf:
        - $ref: "#/components/schemas/StayRequest"
        - type: object
          required: [guest]
          properties:
            guest: { $ref: "#/components/schemas/Guest" }
            remarks: { type: [string, "null"], maxLength: 1000, description: Free text from the guest; shown to the desk. }
            idempotencyKey: { type: [string, "null"], minLength: 8, maxLength: 128, description: Alternative to the Idempotency-Key header. }

    Quote:
      type: object
      required:
        [propertyId, roomType, ratePlan, mealPlanCode, checkIn, checkOut, nights, adults, children,
         currency, pricesIncludeTaxes, available, roomsAvailable, totals, allocations, taxLines,
         nightly, warnings]
      properties:
        propertyId: { type: string }
        roomType: { $ref: "#/components/schemas/Ref" }
        ratePlan: { $ref: "#/components/schemas/Ref" }
        mealPlanCode: { type: string }
        checkIn: { $ref: "#/components/schemas/Day" }
        checkOut: { $ref: "#/components/schemas/Day" }
        nights: { type: integer }
        adults: { type: integer }
        children: { type: integer }
        currency: { type: string }
        pricesIncludeTaxes: { type: boolean }
        available: { type: boolean, description: Whether the stay could be booked right now. }
        roomsAvailable: { type: integer, description: Rooms of this type free for every night. }
        totals:
          type: object
          required: [roomBase, extraOccupancy, packageAllocations, taxes, greenTax, grandTotal]
          properties:
            roomBase: { type: number }
            extraOccupancy: { type: number }
            packageAllocations:
              type: number
              description: Everything the plan includes plus any extras the guest ticked.
            taxes: { type: number, description: All percentage taxes and service charge. }
            greenTax: { type: number }
            grandTotal: { type: number, description: The amount to display as the price of the stay. }
        allocations:
          type: array
          description: >-
            Every allocation on this stay, itemised. `source` says why each line is there:
            RATE_PLAN or MEAL_PLAN came with what the guest chose (show as included),
            MANUAL was ticked by the guest (show as removable). `mode` INCLUDE_IN_RATE is
            carved out of the room line, so its amount is ALREADY inside totals.roomBase
            and must not be added again; ADD_TO_RATE sits on top. grandTotal is correct
            either way.
          items:
            type: object
            required: [id, code, name, source, mode, amount]
            properties:
              id: { type: string }
              code: { type: string }
              name: { type: string }
              source: { type: string, enum: [RATE_PLAN, MEAL_PLAN, MANUAL] }
              mode: { type: string, enum: [INCLUDE_IN_RATE, ADD_TO_RATE] }
              amount: { type: number, description: Base + tax + service charge for the stay. }
        taxLines:
          type: array
          items:
            type: object
            required: [name, ratePercent, amount]
            properties:
              name: { type: string }
              ratePercent: { type: number }
              amount: { type: number }
        nightly:
          type: array
          items:
            type: object
            required: [date, rate, roomCharge, taxes, total]
            properties:
              date: { $ref: "#/components/schemas/Day" }
              rate: { type: number }
              roomCharge: { type: number }
              taxes: { type: number }
              total: { type: number }
        warnings:
          type: array
          items: { type: string }

    Booking:
      type: object
      required: [bookingId, confirmationNo, reservationId, status, replayed, property, guest, quote]
      properties:
        bookingId: { type: string }
        confirmationNo: { type: string, example: CBR-000482 }
        reservationId: { type: string }
        status:
          type: string
          enum: [RESERVED, IN_HOUSE, CHECKED_OUT, NO_SHOW, CANCELLED]
        replayed: { type: boolean, description: True when returned for a repeated Idempotency-Key. }
        property:
          type: object
          required: [id, name, checkInTime, checkOutTime]
          properties:
            id: { type: string }
            name: { type: string }
            checkInTime: { type: string }
            checkOutTime: { type: string }
        guest:
          type: object
          required: [firstName, email]
          properties:
            firstName: { type: string }
            lastName: { type: [string, "null"] }
            email: { type: string }
        quote: { $ref: "#/components/schemas/Quote" }

    ActivityRules:
      type: object
      description: The property's online booking rules for this module.
      properties:
        enabled: { type: boolean, description: False while the property is not taking online bookings for this module. }
        code: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        holdMinutes: { type: integer, description: How long a hold keeps its place. }
        leadHours: { type: integer, description: Online booking closes this many hours before the start. }
        maxPartySize: { type: integer, description: Excursions — the largest party per booking. }
        genderPreferenceOffered: { type: boolean, description: Spa — whether a therapist gender may be requested. }
        freeCancellationHours: { type: integer, description: Spa — free cancellation until this long before the start. }
        paidOnlineAccepted: { type: boolean, description: Whether a booking may be sent as PAID. }
        policies: { type: [string, "null"] }

    ExcursionCatalogue:
      type: object
      properties:
        propertyId: { type: string }
        currency: { type: string, example: USD }
        pricesIncludeTaxes: { type: boolean }
        booking: { $ref: "#/components/schemas/ActivityRules" }
        excursions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              code: { type: string }
              name: { type: string, example: Sunset Dolphin Cruise }
              description: { type: [string, "null"] }
              inclusions: { type: [string, "null"] }
              imageUrls: { type: array, items: { type: string } }
              pricingMode: { type: string, enum: [PER_PERSON, FLAT] }
              prices:
                type: [object, "null"]
                description: "PER_PERSON: adult/child/infant. FLAT: one price for the party. Before tax handling — quote for the total."
                properties:
                  adult: { type: number }
                  child: { type: number }
                  infant: { type: number }
                  flat: { type: number }
              freeCancellationHours: { type: integer }

    Departure:
      type: object
      properties:
        id: { type: string }
        excursionId: { type: string }
        date: { $ref: "#/components/schemas/Day" }
        time: { type: string, example: "17:00" }
        meetingTime: { type: [string, "null"] }
        meetingPoint: { type: [string, "null"] }
        capacity: { type: integer }
        seatsLeft: { type: integer, description: "Live: bookings and other websites' holds already taken off." }
        minGuests: { type: [integer, "null"] }
        guaranteed: { type: boolean, description: False while below its minimum — the property may still call it off. }
        bookingClosesAt: { type: string, format: date-time }
        prices: { type: [object, "null"] }
        bookable: { type: boolean }

    DepartureList:
      type: object
      properties:
        propertyId: { type: string }
        from: { $ref: "#/components/schemas/Day" }
        to: { $ref: "#/components/schemas/Day" }
        currency: { type: string }
        bookingEnabled: { type: boolean }
        departures: { type: array, items: { $ref: "#/components/schemas/Departure" } }

    ExcursionPartyRequest:
      type: object
      required: [departureId, adults]
      properties:
        departureId: { type: string }
        adults: { type: integer, minimum: 0 }
        children: { type: integer, minimum: 0, default: 0 }
        infants: { type: integer, minimum: 0, default: 0 }

    ActivityTotals:
      type: object
      properties:
        base: { type: number }
        serviceCharge: { type: number }
        taxes: { type: number }
        levies: { type: number }
        grandTotal: { type: number, description: What the guest pays — show this. }

    ExcursionQuote:
      type: object
      properties:
        departureId: { type: string }
        excursionId: { type: string }
        adults: { type: integer }
        children: { type: integer }
        infants: { type: integer }
        currency: { type: string }
        pricesIncludeTaxes: { type: boolean }
        totals: { $ref: "#/components/schemas/ActivityTotals" }
        lines: { type: array, items: { type: object, properties: { description: { type: string }, amount: { type: number } } } }
        available: { type: boolean }
        seatsLeft: { type: integer }

    ExcursionHold:
      type: object
      properties:
        holdId: { type: string }
        expiresAt: { type: string, format: date-time }
        quote: { $ref: "#/components/schemas/ExcursionQuote" }

    ActivityGuest:
      type: object
      required: [firstName, email]
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 40 }

    ActivityPayment:
      type: object
      required: [status]
      description: What your site did about payment. Uppsolut Stay takes no payment itself.
      properties:
        status: { type: string, enum: [PAID, UNPAID], description: "PAID: you took payment. UNPAID: the guest pays at the property." }
        provider: { type: string, maxLength: 60, example: Stripe }
        reference: { type: string, maxLength: 120, description: Your payment reference — shown to the desk. }
        amount: { type: number }
        currency: { type: string, minLength: 3, maxLength: 3 }

    ExcursionBookingRequest:
      type: object
      required: [guest, payment]
      description: Either `holdId`, or `departureId` + `adults` (+ `children`, `infants`).
      properties:
        holdId: { type: string }
        departureId: { type: string }
        adults: { type: integer, minimum: 0 }
        children: { type: integer, minimum: 0 }
        infants: { type: integer, minimum: 0 }
        guest: { $ref: "#/components/schemas/ActivityGuest" }
        payment: { $ref: "#/components/schemas/ActivityPayment" }
        expectedTotal: { type: number, description: The grandTotal you showed — refused with PRICE_CHANGED if it moved. }
        remarks: { type: string, maxLength: 1000 }

    SpaCatalogue:
      type: object
      properties:
        propertyId: { type: string }
        currency: { type: string }
        pricesIncludeTaxes: { type: boolean }
        booking: { $ref: "#/components/schemas/ActivityRules" }
        categories:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: Massage }
              treatments:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string, example: Aromatherapy Massage }
                    description: { type: [string, "null"] }
                    inclusions: { type: [string, "null"] }
                    imageUrls: { type: array, items: { type: string } }
                    durationMinutes: { type: integer }
                    maxGuests: { type: integer }
                    pricingMode: { type: string, enum: [PER_PERSON, FLAT] }
                    price: { type: [number, "null"] }

    SpaAvailability:
      type: object
      description: "With `date`: `slots`. With `from`/`to`: `days`."
      properties:
        treatmentId: { type: string }
        date: { $ref: "#/components/schemas/Day" }
        partySize: { type: integer }
        durationMinutes: { type: integer }
        slots:
          type: array
          items:
            type: object
            properties:
              startTime: { type: string, example: "10:00" }
              endTime: { type: string, example: "11:00" }
              available: { type: boolean }
        days:
          type: array
          items:
            type: object
            properties:
              date: { $ref: "#/components/schemas/Day" }
              available: { type: boolean }

    SpaQuote:
      type: object
      properties:
        treatmentId: { type: string }
        date: { $ref: "#/components/schemas/Day" }
        partySize: { type: integer }
        currency: { type: string }
        pricesIncludeTaxes: { type: boolean }
        totals: { $ref: "#/components/schemas/ActivityTotals" }
        lines: { type: array, items: { type: object, properties: { description: { type: string }, amount: { type: number } } } }

    SpaSlotRequest:
      type: object
      required: [treatmentId, date, startTime]
      properties:
        treatmentId: { type: string }
        date: { $ref: "#/components/schemas/Day" }
        startTime: { type: string, example: "10:00" }
        partySize: { type: integer, minimum: 1, default: 1 }
        gender: { type: string, enum: [MALE, FEMALE] }

    SpaHold:
      type: object
      properties:
        holdId: { type: string }
        expiresAt: { type: string, format: date-time }
        startTime: { type: string }
        quote: { $ref: "#/components/schemas/SpaQuote" }

    SpaBookingRequest:
      type: object
      required: [guest, payment]
      description: Either `holdId`, or `treatmentId` + `date` + `startTime` (+ `partySize`, `gender`).
      properties:
        holdId: { type: string }
        treatmentId: { type: string }
        date: { $ref: "#/components/schemas/Day" }
        startTime: { type: string }
        partySize: { type: integer, minimum: 1 }
        gender: { type: string, enum: [MALE, FEMALE] }
        guest: { $ref: "#/components/schemas/ActivityGuest" }
        companions: { type: array, items: { type: string }, description: "Names of the other guests, in order." }
        payment: { $ref: "#/components/schemas/ActivityPayment" }
        expectedTotal: { type: number }
        remarks: { type: string, maxLength: 1000 }

    ActivityBooking:
      type: object
      description: An excursion or spa booking. Fields under "Excursions" or "Spa" appear for that module only.
      properties:
        reference: { type: string, example: EXC-7K3QX9MD, description: Give this to the guest. }
        module: { type: string, enum: [EXCURSIONS, SPA] }
        status: { type: string, description: "CONFIRMED | CANCELLED | COMPLETED | NO_SHOW (spa also CHECKED_IN | IN_TREATMENT)" }
        replayed: { type: boolean }
        property: { type: object, properties: { id: { type: string }, name: { type: string } } }
        guest: { type: object, properties: { firstName: { type: string }, lastName: { type: [string, "null"] }, email: { type: string } } }
        payment: { type: object, properties: { status: { type: string }, reference: { type: [string, "null"] } } }
        total: { type: object, properties: { grandTotal: { type: number }, currency: { type: string } } }
        cancellation:
          type: object
          properties:
            allowed: { type: boolean, description: Whether the guest can still cancel online. }
            freeUntil: { type: string, format: date-time }
            cancelledAt: { type: [string, "null"], format: date-time }
            refundRequired: { type: boolean, description: Cancelled after being paid online — refund through your provider. }
        moved: { type: boolean, description: Excursions — the property moved the guest to another departure. }
        excursion: { type: object, properties: { id: { type: string }, name: { type: string } } }
        departure:
          type: object
          properties:
            id: { type: string }
            date: { $ref: "#/components/schemas/Day" }
            time: { type: string }
